<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0b0c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="GymProgress">
<title>GymProgress</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header>
  <div>
    <div class="date" id="date"></div>
    <h1 id="title">Today</h1>
  </div>
  <button class="burger" id="burger" aria-label="Menu"><span></span><span></span><span></span></button>
</header>

<main id="v-today"></main>
<main id="v-progress" hidden></main>
<main id="v-body" hidden></main>
<main id="v-settings" hidden></main>

<div class="scrim" id="scrim"></div>
<nav class="menu" aria-label="Menu">
  <button class="close" id="menu-close" aria-label="Close menu">×</button>
  <h3>GymProgress</h3>
  <a href="#today" data-v="today">Today <span>log workout</span></a>
  <a href="#progress" data-v="progress">Progress <span>strength &amp; volume</span></a>
  <a href="#body" data-v="body">Body <span>weight &amp; measures</span></a>
  <a href="#settings" data-v="settings">Settings <span>program, units</span></a>
</nav>

<script src="app.js"></script>
</body>
</html>
